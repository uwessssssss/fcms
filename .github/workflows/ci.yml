# FCMS v2 -- every check, on every push and pull request.
#
#   database  fresh migrate + 101 tests, seeds, business scenarios, the attacks
#             that must fail (security.sql), every API statement prepares,
#             and 14 simulated trading days with every control checked
#   static    the 18 static checks (verify.sh)
#   web       install, type check, the runtime checks, production build
#   api       dotnet build with warnings as errors
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5544:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5544"
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Migrate a fresh database and run the 101 tests
        run: |
          createdb fcms_check
          cd db && PGDATABASE=fcms_check ./migrate.sh test | tee /tmp/migrate.log
          grep -E "^\s+[0-9]+ \|\s+0 \|" /tmp/migrate.log
      - name: Every API statement prepares; every query fills its class
        run: |
          python3 tools/dbrun/prepare_all.py fcms_check
          python3 tools/dbrun/columns.py fcms_check
          python3 tools/dbrun/permissions.py fcms_check
      - name: Demo data and business scenarios
        run: |
          cd db
          for f in one_station depot demo_day; do psql -d fcms_check -v ON_ERROR_STOP=1 -q -f seed/$f.sql >/dev/null; done
          psql -d fcms_check -X -v ON_ERROR_STOP=1 -f test/scenarios.sql
      - name: Attacks that must fail (security)
        run: psql -d fcms_check -X -v ON_ERROR_STOP=1 -f db/test/security.sql
      - name: 14 simulated trading days, every control checked
        env:
          SIM_NO_DUMP: "1"
        run: |
          sudo apt-get install -y -q gcc >/dev/null
          bash tools/sim/run.sh 14
      - name: Two more random months (the seeds that once broke wallet matching)
        env:
          SIM_NO_DUMP: "1"
        run: |
          SIM_SEED=97 bash tools/sim/run.sh 30
          SIM_SEED=555 bash tools/sim/run.sh 30

  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The 18 static checks
        run: ./verify.sh

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Runtime checks (calls, blank numbers, buttons)
        working-directory: tools/runtime
        env:
          NODE_PATH: ${{ github.workspace }}/web/node_modules
        run: bash run.sh
      - name: Production build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: npm run build

  api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build, warnings as errors
        run: dotnet build api -warnaserror

  # The whole stack, as a person meets it: the 90-day demo database, the API,
  # the web app, and a browser signing in as every role and opening every
  # screen. Screenshots and the report are the job's artifact.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      POSTGRES_USER: postgres
      PGUSER: postgres
      DEMO_PASSWORD: "Demo-2026!"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Database -- the 90-day demo (simulated, no real station)
        env:
          FCMS_APP_PASSWORD: e2e-app-password
          FCMS_DEMO_DUMP: db/sim/fcms_sim.dump
        run: |
          bash deploy/db/10-fcms-demo.sh
          # the roles the demo has nobody in: director, auditor, depot manager
          psql -d fcms -X -v pw="$DEMO_PASSWORD" -f tests/e2e/extra-roles.sql

      - name: API -- build and start
        run: |
          dotnet build api -c Release
          cd api
          export FCMS_DB="Host=localhost;Port=5432;Database=fcms;Username=fcms_app;Password=e2e-app-password;MaxPoolSize=25"
          export Auth__SigningKey="$(openssl rand -base64 48)"
          export ASPNETCORE_URLS=http://localhost:5000
          export Proxy__TrustForwardedFor=true
          nohup dotnet bin/Release/net8.0/Fcms.Api.dll > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:5000/health >/dev/null && break; sleep 2; done
          curl -fsS http://localhost:5000/health || (cat /tmp/api.log; exit 1)

      - name: Web -- build and start
        working-directory: web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
        run: |
          npm ci --no-audit --no-fund
          npm run build
          nohup npx next start -p 3000 > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:3000/sign-up-login-screen >/dev/null && break; sleep 2; done
          curl -fsS -o /dev/null http://localhost:3000/sign-up-login-screen || (cat /tmp/web.log; exit 1)

      - name: Browser -- every role, every screen, every field, the numbers
        working-directory: tests/e2e
        env:
          BASE: http://localhost:3000
          API: http://localhost:5000
          PASSWORD: "Demo-2026!"
          PGUSER: postgres
          PGDATABASE: fcms
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          # what each screen expects of each call, from the real TypeScript
          node contracts.cjs ../../web > contracts.json
          set +e
          node e2e.mjs;    screens=$?
          node values.mjs; values=$?
          exit $(( screens || values ))

      - name: Report
        if: always()
        run: |
          cat tests/e2e/out/REPORT.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no report" >> "$GITHUB_STEP_SUMMARY"
          cat tests/e2e/out/VALUES.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cp /tmp/api.log /tmp/web.log tests/e2e/out/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: tests/e2e/out
          retention-days: 14
